services:
  pushgateway:
    image: prom/pushgateway:v1.11.3
    ports:
      - "19091:9091"
    healthcheck:
      test: ["CMD", "/bin/pushgateway", "--version"]
      interval: 2s
      timeout: 2s
      retries: 10

  signal-generator:
    build:
      context: ../../..
      dockerfile: Dockerfile
    command: ["run", "--config", "/app/examples/metrics/container-config.json"]
    depends_on:
      pushgateway:
        condition: service_healthy
    ports:
      - "19108:9108"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/healthz', timeout=2)",
        ]
      interval: 2s
      timeout: 3s
      retries: 20

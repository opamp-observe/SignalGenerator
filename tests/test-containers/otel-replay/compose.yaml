services:
  otel-receiver:
    image: python:3.11-slim
    command: ["python", "/receiver/dummy_otel.py"]
    volumes:
      - ./dummy_otel.py:/receiver/dummy_otel.py:ro
    ports: ["14318:4318"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4318/healthz', timeout=2)"]
      interval: 1s
      timeout: 2s
      retries: 15

  signal-generator:
    build:
      context: ../../..
      dockerfile: Dockerfile
    command: ["run", "--config", "/fixtures/config.json"]
    volumes:
      - ./:/fixtures:ro
    depends_on:
      otel-receiver:
        condition: service_healthy
    healthcheck:
      disable: true


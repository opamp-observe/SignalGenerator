services:
  pushgateway:
    profiles: ["push"]
    image: prom/pushgateway:v1.11.3
    ports: ["19091:9091"]
    healthcheck:
      test: ["CMD", "/bin/pushgateway", "--version"]
      interval: 2s
      timeout: 2s
      retries: 15

  signal-generator-push:
    profiles: ["push"]
    build:
      context: ../../..
      dockerfile: Dockerfile
    command: ["run", "--config", "/app/examples/metrics/container-config.json"]
    depends_on:
      pushgateway:
        condition: service_healthy

  signal-generator-pull:
    profiles: ["pull"]
    build:
      context: ../../..
      dockerfile: Dockerfile
    command: ["run", "--config", "/app/examples/metrics/pull-container-config.json"]
    ports: ["19108:9108"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

  prometheus-pull:
    profiles: ["pull"]
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus-pull.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["19090:9090"]
    depends_on:
      signal-generator-pull:
        condition: service_healthy

  unified:
    profiles: ["unified"]
    build:
      context: ../../..
      dockerfile: integrations/opamp-simulator/Dockerfile
      additional_contexts:
        opamp_core: ${OPAMP_CORE_CONTEXT:-../../../../opamp2}
    environment:
      APP_ENABLE_DEV_FEATURES: "true"
    ports: ["19110:9108"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9108/healthz', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 30

  prometheus-unified:
    profiles: ["unified"]
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus-unified.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["19092:9090"]
    depends_on:
      unified:
        condition: service_healthy

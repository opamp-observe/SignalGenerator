name: OpAMP extension regression

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to test
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: opamp-extension-regression-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  opamp-extension:
    if: ${{ vars.ENABLE_REGRESSION_TESTS != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: docker/setup-buildx-action@v4
      - name: Run isolated OpAMP consumer extension regression
        run: >-
          python scripts/run_regression.py
          --profile unified
          --output test-results/opamp-regression.json
      - name: Upload OpAMP regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opamp-extension-regression-${{ github.run_id }}
          path: test-results/opamp-regression.json
          if-no-files-found: warn
      - name: Remove scoped test containers
        if: always()
        run: >-
          docker compose -p signal-generator-regression-unified
          -f tests/test-containers/phase5/compose.yaml
          --profile unified down --remove-orphans --volumes || true

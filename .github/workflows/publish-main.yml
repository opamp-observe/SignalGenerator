name: publish main wheel

on:
  workflow_run:
    workflows: [quality]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-main-wheel
  cancel-in-progress: false

jobs:
  build-wheel:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install wheel build tools
        run: python -m pip install --upgrade "pip>=26.2" "setuptools>=84.1" "build>=1.2" "twine>=6.0"
      - id: version
        name: Check whether this version is unpublished
        shell: bash
        run: |
          version="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://pypi.org/pypi/signal-generator/${version}/json")"
          case "${status}" in
            200) publish=false ;;
            404) publish=true ;;
            *) echo "PyPI version check failed with HTTP ${status}" >&2; exit 1 ;;
          esac
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
      - if: steps.version.outputs.publish == 'true'
        name: Build and validate wheel
        run: |
          python -m build --wheel --outdir dist .
          python -m twine check dist/*
      - if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: main-wheel-${{ steps.version.outputs.version }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish-wheel:
    if: needs.build-wheel.outputs.publish == 'true'
    needs: build-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: main-wheel-${{ needs.build-wheel.outputs.version }}
          path: dist
      - name: Publish wheel with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist


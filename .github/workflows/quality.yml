name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=84.1"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/security_checks.py
      - if: matrix.python-version == '3.13'
        run: python -m build
      - if: matrix.python-version == '3.13'
        run: python -m twine check dist/*

  metrics-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: docker compose -f tests/test-containers/metrics/compose.yaml up --build --detach --wait
      - run: python tests/test-containers/metrics/verify.py
      - if: always()
        run: docker compose -f tests/test-containers/metrics/compose.yaml down --remove-orphans

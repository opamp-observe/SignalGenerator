name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate GitHub Actions workflows
        run: >-
          docker run --rm
          -v "${PWD}:/repo"
          -w /repo
          rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade "pip>=26.2" "setuptools>=84.1"
      - run: python -m pip install -e ".[dev]"
      - run: python scripts/security_checks.py --scope core
      - if: matrix.python-version == '3.13'
        run: python -m build
      - if: matrix.python-version == '3.13'
        run: python -m twine check dist/*

  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: opamp-observe/opamp-core
          path: opamp-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e . -e opamp-core/consumer -e "integrations/opamp-simulator[dev]"
      - working-directory: integrations/opamp-simulator
        run: |
          python -m ruff check src tests
          python -m pylint src/signal_generator_opamp_sim
          python -m pytest -q
          python -m xenon --max-absolute B --max-modules A --max-average A src/signal_generator_opamp_sim
          python -m build
          python -m twine check dist/*

  performance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e .
      - run: python scripts/benchmark_replay.py --output test-results/performance.json
      - uses: actions/upload-artifact@v4
        with:
          name: performance-python-3.13
          path: test-results/performance.json

  metrics-container:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [pull, push]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: docker compose -f tests/test-containers/phase5/compose.yaml --profile ${{ matrix.profile }} up --build --detach --wait
      - run: python tests/test-containers/phase5/verify.py ${{ matrix.profile }}
      - if: always()
        run: docker compose -f tests/test-containers/phase5/compose.yaml --profile ${{ matrix.profile }} down --remove-orphans

  unified-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: opamp-observe/opamp-core
          path: opamp-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - env:
          OPAMP_CORE_CONTEXT: ${{ github.workspace }}/opamp-core
        run: docker compose -f tests/test-containers/phase5/compose.yaml --profile unified up --build --detach --wait
      - run: python tests/test-containers/phase5/verify.py unified
      - if: always()
        run: docker compose -f tests/test-containers/phase5/compose.yaml --profile unified down --remove-orphans

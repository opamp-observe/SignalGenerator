[build-system]
requires = ["setuptools>=84.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-generator-opamp-sim"
version = "0.1.0"
description = "Independent OpAMP simulator adapter for SignalGenerator"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["license.txt"]
authors = [{ name = "Phil Wilkins" }]
keywords = ["opamp", "prometheus", "signal-generator", "simulator"]
dependencies = [
  "httpx>=0.27",
  "jsonschema>=4.23",
  "opamp-consumer>=0.6.0,<0.7.0",
  "signal-generator>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
unified = ["hypercorn>=0.17", "quart>=0.19.4"]
dev = [
  "build>=1.2",
  "pylint>=3.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=7.0.0",
  "quart>=0.19.4",
  "ruff>=0.15.0",
  "twine>=6.0",
  "xenon>=0.9",
]

[project.scripts]
signal-generator-opamp-sim = "signal_generator_opamp_sim.cli:main"

[project.entry-points."opamp_consumer.plugins"]
signal_generator = "signal_generator_opamp_sim.supervised_plugin:main"

[project.urls]
Repository = "https://github.com/opamp-observe/SignalGenerator-Python"
Homepage = "https://opamp.info"
Blog = "https://opamp.info"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_generator_opamp_sim = ["schemas/*.json"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
addopts = [
  "--cov=signal_generator_opamp_sim",
  "--cov-report=term-missing",
  "--cov-branch",
  "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["signal_generator_opamp_sim"]

[tool.coverage.report]
show_missing = true
precision = 2
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "S", "C90"]
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["signal_generator_opamp_sim"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = ["broad-exception-caught", "too-few-public-methods"]
